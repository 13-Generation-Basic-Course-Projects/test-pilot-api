name: Telegram Notification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Telegram Message
        id: prepare_message
        run: |
          # Function to escape ALL known MarkdownV2 special characters
          # These are: _, *, [, ], (, ), ~, `, >, #, +, -, =, |, {, }, ., !
          # Only escape if not part of a valid MarkdownV2 syntax (e.g., link [text](url))
          # For simplicity and robustness, we'll escape most, especially in dynamic text.
          escape_markdownv2() {
          local text="$1"
          text=$(echo "$text" | sed 's/\\/\\\\/g')    # backslash (MUST be first)
          text=$(echo "$text" | sed 's/\_/\\_/g')     # underscore
          text=$(echo "$text" | sed 's/\*/\\*/g')     # asterisk
          text=$(echo "$text" | sed 's/\[/\\[/g')     # left bracket
          text=$(echo "$text" | sed 's/\]/\\]/g')     # right bracket
          text=$(echo "$text" | sed 's/(/\\(/g')      # left parenthesis
          text=$(echo "$text" | sed 's/)/\\)/g')      # right parenthesis
          text=$(echo "$text" | sed 's/~/\\~/g')      # tilde
          text=$(echo "$text" | sed 's/\`/\\`/g')     # backtick
          text=$(echo "$text" | sed 's/>/\\>/g')      # greater than
          text=$(echo "$text" | sed 's/#/\\#/g')      # hash
          text=$(echo "$text" | sed 's/\+/\\+/g')     # plus
          text=$(echo "$text" | sed 's/\-/\\-/g')     # hyphen
          text=$(echo "$text" | sed 's/=/\\=/g')      # equals
          text=$(echo "$text" | sed 's/|/\\|/g')      # pipe
          text=$(echo "$text" | sed 's/{/\\{/g')      # left brace
          text=$(echo "$text" | sed 's/}/\\}/g')      # right brace ← FIXED
          text=$(echo "$text" | sed 's/\./\\./g')     # dot
          text=$(echo "$text" | sed 's/!/\\!/g')      # exclamation mark
          echo "$text"
        }

          MESSAGE_TEMPLATE=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            COMMIT_MESSAGE=$(escape_markdownv2 "${{ github.event.commits[0].message }}")
            AUTHOR_NAME=$(escape_markdownv2 "${{ github.event.head_commit.author.name }}")
            AUTHOR_EMAIL=$(escape_markdownv2 "${{ github.event.head_commit.author.email }}")
            TIMESTAMP=$(escape_markdownv2 "${{ github.event.head_commit.timestamp }}")
            BRANCH_REF_NAME=$(escape_markdownv2 "${{ github.ref_name }}")
            REPO_NAME=$(escape_markdownv2 "${{ github.repository }}")
            GH_ACTOR=$(escape_markdownv2 "${{ github.actor }}")
            
            MESSAGE_TEMPLATE="🚀 *New Commit Alert* 🚀
            ---
            👤 *Pushed by:* \`${GH_ACTOR}\`

            📄 *Message:*
            \`${COMMIT_MESSAGE}\`

            ---
            🌿 *Branch:* \`${BRANCH_REF_NAME}\`

            📂 *Repository:* [${REPO_NAME}](https://github.com/${{ github.repository }})

            ---
            🔗 *View Details:*
            [Click here to see the commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ---
            🕒 *Timestamp:*
            \`${TIMESTAMP}\`

            ---
            📝 *Additional Details:*
            • *Author:* \`${AUTHOR_NAME}\`
            • *Email:* \`${AUTHOR_EMAIL}\`
            • *Commit ID:* \`${{ github.sha }}\`"
          
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_TITLE=$(escape_markdownv2 "${{ github.event.pull_request.title }}")
            CREATED_AT=$(escape_markdownv2 "${{ github.event.pull_request.created_at }}")
            SOURCE_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.head.ref }}")
            TARGET_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.base.ref }}")
            REPO_NAME=$(escape_markdownv2 "${{ github.repository }}")
            GH_ACTOR=$(escape_markdownv2 "${{ github.actor }}")

            MESSAGE_TEMPLATE="🔔 *New Pull Request Alert* 🔔
            ---
            👤 *Opened by:* \`${GH_ACTOR}\`

            📄 *Message:*
            \`${PR_TITLE}\`

            ---
            🌿 *Branch:* \`${{ github.ref_name }}\`

            📂 *Repository:* [${REPO_NAME}](https://github.com/${{ github.repository }})

            ---
            🔗 *View Details:*
            [Click here to see the pull request](${{ github.event.pull_request.html_url }})

            ---
            🕒 *Timestamp:*
            \`${CREATED_AT}\`

            ---
            📝 *Additional Details:*
            • *Source Branch:* \`${SOURCE_BRANCH}\`
            • *Target Branch:* \`${TARGET_BRANCH}\`
            • *PR Number:* \`${{ github.event.pull_request.number }}\`"
          fi

          # Set the message as an output of this step
          # Note: Using printf %s for safer multiline string output
          printf "%s\n" "message<<EOF" >> $GITHUB_OUTPUT
          printf "%s\n" "$MESSAGE_TEMPLATE" >> $GITHUB_OUTPUT
          printf "%s\n" "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdownv2
          message: ${{ steps.prepare_message.outputs.message }}
