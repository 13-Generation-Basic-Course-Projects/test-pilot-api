name: Telegram Notification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Recommended to checkout the repository

      - name: Prepare Telegram Message
        id: prepare_message # Give this step an ID to access its output
        run: |
          # Function to escape special MarkdownV2 characters
          # List of characters to escape: _, *, [, ], (, ), ~, `, >, #, +, -, =, |, {, }, ., !
          # We only need to escape the ones that might appear in dynamic content and cause issues.
          # For this case, specifically '-', but good to be comprehensive for future proofing.
          # More comprehensive list to escape for markdownV2: https://core.telegram.org/bots/api#markdownv2-style
          escape_markdownv2() {
            local text="$1"
            # Escape hyphens (already identified as an issue)
            text=$(echo "$text" | sed 's/-/\\-/g')
            # Add other characters to escape if they cause problems in your dynamic content
            # text=$(echo "$text" | sed 's/_/\\_/g') # Example for underscore
            # text=$(echo "$text" | sed 's/\*/\\\*/g') # Example for asterisk
            # ... and so on for other special characters as needed.
            echo "$text"
          }

          MESSAGE=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            COMMIT_MESSAGE=$(escape_markdownv2 "${{ github.event.commits[0].message }}")
            AUTHOR_NAME=$(escape_markdownv2 "${{ github.event.head_commit.author.name }}")
            AUTHOR_EMAIL=$(escape_markdownv2 "${{ github.event.head_commit.author.email }}")
            TIMESTAMP=$(escape_markdownv2 "${{ github.event.head_commit.timestamp }}")

            MESSAGE="🚀 *New Commit Alert* 🚀
            ---
            👤 *Pushed by:* \`${{ github.actor }}\`

            📄 *Message:*
            \`${COMMIT_MESSAGE}\`

            ---
            🌿 *Branch:* \`${{ github.ref_name }}\`

            📂 *Repository:* [${{ github.repository }}](https://github.com/${{ github.repository }})

            ---
            🔗 *View Details:*
            [Click here to see the commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ---
            🕒 *Timestamp:*
            \`${TIMESTAMP}\`

            ---
            📝 *Additional Details:*
            • *Author:* \`${AUTHOR_NAME}\`
            • *Email:* \`${AUTHOR_EMAIL}\`
            • *Commit ID:* \`${{ github.sha }}\`"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_TITLE=$(escape_markdownv2 "${{ github.event.pull_request.title }}")
            CREATED_AT=$(escape_markdownv2 "${{ github.event.pull_request.created_at }}")
            SOURCE_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.head.ref }}")
            TARGET_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.base.ref }}")

            MESSAGE="🔔 *New Pull Request Alert* 🔔
            ---
            👤 *Opened by:* \`${{ github.actor }}\`

            📄 *Message:*
            \`${PR_TITLE}\`

            ---
            🌿 *Branch:* \`${{ github.ref_name }}\`

            📂 *Repository:* [${{ github.repository }}](https://github.com/${{ github.repository }})

            ---
            🔗 *View Details:*
            [Click here to see the pull request](${{ github.event.pull_request.html_url }})

            ---
            🕒 *Timestamp:*
            \`${CREATED_AT}\`

            ---
            📝 *Additional Details:*
            • *Source Branch:* \`${SOURCE_BRANCH}\`
            • *Target Branch:* \`${TARGET_BRANCH}\`
            • *PR Number:* \`${{ github.event.pull_request.number }}\`"
          fi

          # Set the message as an output of this step
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdownv2
          message: ${{ steps.prepare_message.outputs.message }}
