name: Telegram Notification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Telegram Message
        id: prepare_message
        shell: bash
        run: |
          escape_markdownv2() {
            local text="$1"
            # Escape characters that are problematic in dynamic content
            # Order matters: escape backslash first
            text=$(echo "$text" | sed 's/\\/\\\\/g')   # backslash
            text=$(echo "$text" | sed 's/_/\\_/g')     # underscore
            text=$(echo "$text" | sed 's/\*/\\\*/g')   # asterisk
            text=$(echo "$text" | sed 's/\[/\\[/g')    # left bracket
            text=$(echo "$text" | sed 's/\]/\\]/g')    # right bracket
            text=$(echo "$text" | sed 's/(/\\(/g')     # left parenthesis
            text=$(echo "$text" | sed 's/)/\\)/g')     # right parenthesis
            text=$(echo "$text" | sed 's/~/\\~/g')     # tilde
            text=$(echo "$text" | sed 's/`/\\`/g')     # backtick
            text=$(echo "$text" | sed 's/>/\\>/g')     # greater than
            text=$(echo "$text" | sed 's/#/\\#/g')     # hash
            text=$(echo "$text" | sed 's/\+/\\+/g')    # plus
            text=$(echo "$text" | sed 's/\-/\\-/g')    # hyphen
            text=$(echo "$text" | sed 's/=/\\=/g')     # equals
            text=$(echo "$text" | sed 's/|/\\|/g')     # pipe
            text=$(echo "$text" | sed 's/{/\\{/g')     # left brace
            text=$(echo "$text" | sed 's/}/\}/g')     # right brace
            text=$(echo "$text" | sed 's/\./\\./g')    # dot
            text=$(echo "$text" | sed 's/!/\\!/g')     # exclamation mark
            echo "$text"
          }

          MESSAGE="" # Initialize MESSAGE to prevent accidental errors

          if [[ "${{ github.event_name }}" == "push" ]]; then
            COMMIT_MESSAGE=$(escape_markdownv2 "${{ github.event.commits[0].message }}")
            AUTHOR_NAME=$(escape_markdownv2 "${{ github.event.head_commit.author.name }}")
            AUTHOR_EMAIL=$(escape_markdownv2 "${{ github.event.head_commit.author.email }}")
            TIMESTAMP=$(escape_markdownv2 "${{ github.event.head_commit.timestamp }}")
            BRANCH=$(escape_markdownv2 "${{ github.ref_name }}")
            REPO_NAME=$(escape_markdownv2 "${{ github.repository }}")
            GH_ACTOR=$(escape_markdownv2 "${{ github.actor }}")

            MESSAGE="🚀 *New Commit Alert* 🚀
            ---
            👤 *Pushed by:* \`${GH_ACTOR}\`

            📄 *Message:*
            \`${COMMIT_MESSAGE}\`

            ---
            🌿 *Branch:* \`${BRANCH}\`

            📂 *Repository:* [${REPO_NAME}](https://github.com/${{ github.repository }})

            ---
            🔗 *View Commit:* [Click here](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ---
            🕒 *Timestamp:* \`${TIMESTAMP}\`

            ---
            📝 *Author:* \`${AUTHOR_NAME}\`
            📧 *Email:* \`${AUTHOR_EMAIL}\`
            🔑 *Commit ID:* \`${{ github.sha }}\`"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_TITLE=$(escape_markdownv2 "${{ github.event.pull_request.title }}")
            CREATED_AT=$(escape_markdownv2 "${{ github.event.pull_request.created_at }}")
            SOURCE_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.head.ref }}")
            TARGET_BRANCH=$(escape_markdownv2 "${{ github.event.pull_request.base.ref }}")
            REPO_NAME=$(escape_markdownv2 "${{ github.repository }}")
            GH_ACTOR=$(escape_markdownv2 "${{ github.actor }}")
            PR_URL=$(escape_markdownv2 "${{ github.event.pull_request.html_url }}")
            PR_NUMBER=$(escape_markdownv2 "${{ github.event.pull_request.number }}")

            MESSAGE="🔔 *New Pull Request Alert* 🔔
            ---
            👤 *Opened by:* \`${GH_ACTOR}\`

            📄 *Title:*
            \`${PR_TITLE}\`

            ---
            🌿 *Source:* \`${SOURCE_BRANCH}\`
            ⬇️ *Target:* \`${TARGET_BRANCH}\`

            ---
            📂 *Repository:* [${REPO_NAME}](https://github.com/${{ github.repository }})

            ---
            🔗 *View PR:* [Click here](${PR_URL})

            ---
            🕒 *Created At:* \`${CREATED_AT}\`

            ---
            📝 *PR Number:* \`${PR_NUMBER}\`"
          fi

          # Set the message as an output of this step
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdownv2
          message: ${{ steps.prepare_message.outputs.message }}
