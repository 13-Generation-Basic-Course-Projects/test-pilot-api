<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <title>You're Invited!</title>
</head>
<body>
<p>Hello,</p>
<p>You have been invited to collaborate on a project. Please confirm by clicking the link below:</p>
<p><!--/*@thymesVar id="projectCollaboratorId" type="java"*/-->
<a th:href="|https://your-frontend-url.com/accept-invite/${projectCollaboratorId}|">Accept Invitation</a></p>
<p>Your verification code is: <!--/*@thymesVar id="verificationCode" type=""*/-->
<strong th:text="${verificationCode}"></strong></p>
</body>
</html>
